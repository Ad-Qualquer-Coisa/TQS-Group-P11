# Build and test on every push and pull request.
# A part that has no code yet is skipped with a notice, so a green run says nothing about it.
# Not here yet: quality gate (SonarQube thresholds are TBD), simulator (stack TBD), E2E.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No backend yet
        if: hashFiles('proj/backend/pom.xml') == ''
        run: echo "::notice::proj/backend has no pom.xml yet, backend not built or tested"

      - uses: actions/setup-java@v4
        if: hashFiles('proj/backend/pom.xml') != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: proj/backend/pom.xml

      # verify runs the unit and integration tests; Testcontainers uses the runner's Docker
      - name: Build and test
        if: hashFiles('proj/backend/pom.xml') != ''
        working-directory: proj/backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No frontend yet
        if: hashFiles('proj/frontend/package.json') == ''
        run: echo "::notice::proj/frontend has no package.json yet, frontend not built or tested"

      - uses: actions/setup-node@v4
        if: hashFiles('proj/frontend/package.json') != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: proj/frontend/package-lock.json

      - name: Build and test
        if: hashFiles('proj/frontend/package.json') != ''
        working-directory: proj/frontend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build
